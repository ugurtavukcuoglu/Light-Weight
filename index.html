<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Lift</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap');

:root {
  --bg: #0a0a0a;
  --surface: #141414;
  --surface2: #1c1c1c;
  --border: #242424;
  --text: #f0f0f0;
  --muted: #555;
  --muted2: #333;
  --accent: #c8ff47;
  --accent2: #47c8ff;
  --danger: #ff5555;
  --pull: #47c8ff;
  --legs: #ff6b6b;
  --push: #c8ff47;
  --radius: 12px;
  --safe-bottom: env(safe-area-inset-bottom, 20px);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  height: 100%;
  overflow: hidden;
  user-select: none;
}

/* ── SCREENS ── */
.screen { display: none; flex-direction: column; height: 100vh; overflow: hidden; }
.screen.active { display: flex; }

/* ── TOP BAR ── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 54px 20px 16px;
  flex-shrink: 0;
}
.topbar-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2rem;
  letter-spacing: 0.06em;
  color: var(--text);
}
.topbar-sub { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 1px; }
.icon-btn {
  width: 40px; height: 40px;
  background: var(--surface);
  border: none; border-radius: 10px;
  color: var(--text); font-size: 1.1rem;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}

/* ── SCROLL AREA ── */
.scroll {
  flex: 1;
  overflow-y: auto;
  padding: 0 16px calc(var(--safe-bottom) + 90px);
  -webkit-overflow-scrolling: touch;
}

/* ── HOME: SPLITS LIST ── */
.split-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  border: 1px solid var(--border);
  transition: background 0.12s;
  active-background: var(--surface2);
}
.split-card:active { background: var(--surface2); }

.split-left { display: flex; align-items: center; gap: 14px; }
.split-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.split-name { font-weight: 600; font-size: 1rem; }
.split-count { font-size: 0.76rem; color: var(--muted); margin-top: 2px; }
.split-arrow { color: var(--muted2); font-size: 1rem; }
.split-actions { display: flex; gap: 8px; }

.fab {
  position: fixed;
  bottom: calc(var(--safe-bottom) + 24px);
  right: 20px;
  width: 56px; height: 56px;
  background: var(--accent);
  color: #0a0a0a;
  border: none; border-radius: 16px;
  font-size: 1.5rem; font-weight: 700;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 20px rgba(200,255,71,0.3);
  z-index: 10;
}

/* ── SPLIT DETAIL ── */
.ex-row {
  background: var(--surface);
  border-radius: var(--radius);
  margin-bottom: 8px;
  border: 1px solid var(--border);
  overflow: hidden;
}
.ex-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px;
  cursor: pointer;
}
.ex-header:active { background: var(--surface2); }
.ex-name-text { font-weight: 500; font-size: 0.93rem; }
.ex-set-count { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
.ex-expand { color: var(--muted); font-size: 0.8rem; transition: transform 0.2s; }
.ex-expand.open { transform: rotate(180deg); }

.sets-area { padding: 0 16px 14px; display: none; }
.sets-area.open { display: block; }

.set-row {
  display: grid;
  grid-template-columns: 28px 1fr 1fr auto;
  gap: 8px;
  align-items: center;
  margin-bottom: 8px;
}
.set-num { font-size: 0.75rem; color: var(--muted); font-weight: 600; text-align: center; }
.set-input {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.9rem;
  font-weight: 500;
  padding: 9px 10px;
  text-align: center;
  width: 100%;
  -webkit-appearance: none;
}
.set-input:focus { outline: none; border-color: var(--accent); }
.set-input::placeholder { color: var(--muted2); }
.set-label { font-size: 0.65rem; color: var(--muted); text-align: center; margin-bottom: 4px; }

.set-del {
  width: 32px; height: 32px;
  background: transparent;
  border: none; color: var(--muted2);
  font-size: 0.9rem; cursor: pointer;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
}
.set-del:active { background: var(--surface2); color: var(--danger); }

.input-labels {
  display: grid;
  grid-template-columns: 28px 1fr 1fr auto;
  gap: 8px;
  margin-bottom: 4px;
}

.btn-add-set {
  width: 100%;
  padding: 9px;
  background: transparent;
  border: 1px dashed var(--muted2);
  border-radius: 8px;
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.82rem;
  cursor: pointer;
  margin-top: 4px;
}
.btn-add-set:active { background: var(--surface2); }

/* ── MODAL ── */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  z-index: 100;
  align-items: flex-end;
  justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  padding: 24px 20px calc(var(--safe-bottom) + 24px);
  width: 100%;
  border-top: 1px solid var(--border);
}
.modal-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.5rem;
  letter-spacing: 0.05em;
  margin-bottom: 18px;
}
.modal-input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 1rem;
  padding: 14px 16px;
  margin-bottom: 12px;
  -webkit-appearance: none;
}
.modal-input:focus { outline: none; border-color: var(--accent); }

.color-picker { display: flex; gap: 10px; margin-bottom: 18px; }
.color-opt {
  width: 32px; height: 32px; border-radius: 50%;
  border: 3px solid transparent;
  cursor: pointer; transition: transform 0.15s;
}
.color-opt.selected { border-color: #fff; transform: scale(1.15); }

.modal-actions { display: flex; gap: 10px; }
.btn-cancel {
  flex: 1; padding: 14px;
  background: var(--surface2);
  border: none; border-radius: 10px;
  color: var(--muted); font-family: 'DM Sans', sans-serif;
  font-size: 0.95rem; font-weight: 500;
  cursor: pointer;
}
.btn-save {
  flex: 2; padding: 14px;
  background: var(--accent);
  border: none; border-radius: 10px;
  color: #0a0a0a; font-family: 'DM Sans', sans-serif;
  font-size: 0.95rem; font-weight: 600;
  cursor: pointer;
}

/* ── HISTORY SCREEN ── */
.hist-day {
  margin-bottom: 20px;
}
.hist-date {
  font-size: 0.7rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
  padding-left: 4px;
}
.hist-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 6px;
}
.hist-ex { font-weight: 500; font-size: 0.9rem; margin-bottom: 6px; }
.hist-sets { display: flex; flex-wrap: wrap; gap: 6px; }
.hist-set-chip {
  background: var(--surface2);
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 0.78rem;
  color: var(--muted);
}
.hist-set-chip span { color: var(--text); font-weight: 500; }

/* ── BOTTOM NAV ── */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  padding-bottom: var(--safe-bottom);
  z-index: 20;
}
.nav-btn {
  flex: 1; padding: 12px 8px 10px;
  background: none; border: none;
  color: var(--muted); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-family: 'DM Sans', sans-serif;
}
.nav-btn.active { color: var(--accent); }
.nav-icon { font-size: 1.2rem; }
.nav-label { font-size: 0.62rem; letter-spacing: 0.08em; text-transform: uppercase; }

/* ── EMPTY STATE ── */
.empty {
  text-align: center;
  padding: 60px 30px;
  color: var(--muted);
}
.empty-icon { font-size: 2.5rem; margin-bottom: 12px; }
.empty-title { font-weight: 600; margin-bottom: 6px; color: var(--text); }
.empty-sub { font-size: 0.85rem; line-height: 1.5; }

/* ── DONE BUTTON ── */
.done-bar {
  position: fixed;
  bottom: calc(var(--safe-bottom) + 60px);
  left: 16px; right: 16px;
  z-index: 15;
}
.btn-done {
  width: 100%;
  padding: 16px;
  background: var(--accent);
  border: none; border-radius: 14px;
  color: #0a0a0a;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.3rem;
  letter-spacing: 0.1em;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(200,255,71,0.25);
}

.chip {
  display: inline-block;
  background: var(--surface2);
  border-radius: 6px;
  padding: 3px 8px;
  font-size: 0.72rem;
  color: var(--muted);
  margin-right: 6px;
  margin-bottom: 4px;
}

.back-btn {
  background: none; border: none;
  color: var(--muted); font-size: 1.3rem;
  cursor: pointer; padding: 4px;
}

.split-badge {
  display: inline-block;
  padding: 2px 10px; border-radius: 20px;
  font-size: 0.68rem; font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase;
  margin-bottom: 16px;
}

.add-ex-btn {
  width: 100%; padding: 14px;
  background: var(--surface);
  border: 1px dashed var(--muted2);
  border-radius: var(--radius);
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.9rem; cursor: pointer;
  margin-bottom: 10px;
}
.add-ex-btn:active { background: var(--surface2); }

.swipe-hint { font-size: 0.7rem; color: var(--muted2); text-align: center; padding: 8px; }

.del-split-btn {
  width: 28px; height: 28px;
  background: transparent; border: none;
  color: var(--muted2); font-size: 0.85rem;
  cursor: pointer; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
}
.del-split-btn:active { color: var(--danger); background: var(--surface2); }

.log-badge {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 0.85rem;
  letter-spacing: 0.06em;
  padding: 2px 8px;
  border-radius: 6px;
  margin-left: 8px;
}
</style>
</head>
<body>

<!-- ══ HOME SCREEN ══ -->
<div class="screen active" id="screen-home">
  <div class="topbar">
    <div>
      <div class="topbar-title">LIFT</div>
      <div class="topbar-sub">Your Splits</div>
    </div>
  </div>
  <div class="scroll" id="splits-list"></div>
  <button class="fab" onclick="openNewSplit()">+</button>
</div>

<!-- ══ SPLIT DETAIL SCREEN ══ -->
<div class="screen" id="screen-split">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px">
      <button class="back-btn" onclick="goHome()">‹</button>
      <div>
        <div class="topbar-title" id="split-detail-name">Pull</div>
        <div class="topbar-sub" id="split-detail-sub">0 exercises</div>
      </div>
    </div>
    <button class="icon-btn" onclick="openAddExercise()">+</button>
  </div>
  <div class="scroll" id="exercises-list"></div>
  <div class="done-bar" id="done-bar" style="display:none">
    <button class="btn-done" onclick="saveSession()">SAVE SESSION</button>
  </div>
</div>

<!-- ══ HISTORY SCREEN ══ -->
<div class="screen" id="screen-history">
  <div class="topbar">
    <div>
      <div class="topbar-title">HISTORY</div>
      <div class="topbar-sub">Past Sessions</div>
    </div>
    <button class="icon-btn" onclick="clearHistory()" style="font-size:0.75rem;color:var(--danger)">CLR</button>
  </div>
  <div class="scroll" id="history-list"></div>
</div>

<!-- ══ BOTTOM NAV ══ -->
<div class="bottom-nav">
  <button class="nav-btn active" id="nav-home" onclick="switchScreen('home')">
    <div class="nav-icon">⊞</div>
    <div class="nav-label">Splits</div>
  </button>
  <button class="nav-btn" id="nav-history" onclick="switchScreen('history')">
    <div class="nav-icon">◷</div>
    <div class="nav-label">History</div>
  </button>
</div>

<!-- ══ NEW SPLIT MODAL ══ -->
<div class="modal-overlay" id="modal-split">
  <div class="modal">
    <div class="modal-title" id="modal-split-title">NEW SPLIT</div>
    <input class="modal-input" id="split-name-input" placeholder="e.g. Pull, Legs, Push A..." maxlength="30">
    <div style="font-size:0.72rem;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:10px">Color</div>
    <div class="color-picker" id="color-picker"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modal-split')">Cancel</button>
      <button class="btn-save" onclick="saveSplit()">Save</button>
    </div>
  </div>
</div>

<!-- ══ ADD EXERCISE MODAL ══ -->
<div class="modal-overlay" id="modal-exercise">
  <div class="modal">
    <div class="modal-title">ADD EXERCISE</div>
    <input class="modal-input" id="ex-name-input" placeholder="Exercise name..." maxlength="50">
    <div style="font-size:0.72rem;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:8px">Quick add from your program</div>
    <div id="quick-add-chips" style="margin-bottom:14px"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modal-exercise')">Cancel</button>
      <button class="btn-save" onclick="saveExercise()">Add</button>
    </div>
  </div>
</div>

<script>
// ── STATE ──
const COLORS = ['#47c8ff','#ff6b6b','#c8ff47','#ffb347','#c47aff','#ff69b4','#7affc4','#ffffff'];

const PRESET_EXERCISES = {
  pull: ['Plate loaded reverse lat pulldown','Chest supported T-bar row','Chest supported plate row','Pull up','Bayesian curl','Cable curl','Back extension','Ab wheel rollout'],
  legs: ['Hip thrust','Romanian deadlift','Pendulum squat','Bulgarian split squat','Leg curl','Calf raise','Cable crunch'],
  push: ['Plate loaded seated chest press','Plate loaded shoulder press','Chest fly','Cable lateral raise','Leaning cable lateral raise','Face pull','Overhead triceps extension','Triceps pushdown','Ab wheel rollout']
};

let state = {
  splits: [],
  sessions: [],
  currentSplitId: null,
  editingSplitId: null,
  selectedColor: COLORS[0],
};

// ── STORAGE ──
function save() { localStorage.setItem('lift_v2', JSON.stringify(state)); }
function load() {
  const d = localStorage.getItem('lift_v2');
  if (d) { try { state = JSON.parse(d); } catch(e){} }
  // seed default splits if empty
  if (!state.splits || state.splits.length === 0) {
    state.splits = [
      { id: uid(), name: 'Pull', color: '#47c8ff', exercises: PRESET_EXERCISES.pull.map(n => ({id: uid(), name: n, sets: []})) },
      { id: uid(), name: 'Legs', color: '#ff6b6b', exercises: PRESET_EXERCISES.legs.map(n => ({id: uid(), name: n, sets: []})) },
      { id: uid(), name: 'Push', color: '#c8ff47', exercises: PRESET_EXERCISES.push.map(n => ({id: uid(), name: n, sets: []})) },
    ];
    save();
  }
  if (!state.sessions) state.sessions = [];
}

function uid() { return Math.random().toString(36).slice(2,9); }

// ── NAV ──
function switchScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  document.getElementById('nav-' + name).classList.add('active');
  if (name === 'home') renderHome();
  if (name === 'history') renderHistory();
}

function goHome() {
  // auto-clear empty sets before going back
  const split = state.splits.find(s => s.id === state.currentSplitId);
  if (split) {
    split.exercises.forEach(ex => {
      ex.sets = ex.sets.filter(s => s.weight || s.reps);
    });
    save();
  }
  document.getElementById('screen-split').classList.remove('active');
  document.getElementById('screen-home').classList.add('active');
  document.getElementById('nav-home').classList.add('active');
  renderHome();
}

// ── HOME ──
function renderHome() {
  const el = document.getElementById('splits-list');
  if (!state.splits.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">🏋️</div><div class="empty-title">No splits yet</div><div class="empty-sub">Tap + to create your first training split</div></div>`;
    return;
  }
  el.innerHTML = state.splits.map(s => `
    <div class="split-card" onclick="openSplit('${s.id}')">
      <div class="split-left">
        <div class="split-dot" style="background:${s.color}"></div>
        <div>
          <div class="split-name">${s.name}</div>
          <div class="split-count">${s.exercises.length} exercise${s.exercises.length !== 1 ? 's' : ''}</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <button class="del-split-btn" onclick="event.stopPropagation();deleteSplit('${s.id}')">✕</button>
        <div class="split-arrow">›</div>
      </div>
    </div>
  `).join('');
}

// ── SPLIT DETAIL ──
function openSplit(id) {
  state.currentSplitId = id;
  const split = state.splits.find(s => s.id === id);
  document.getElementById('split-detail-name').textContent = split.name;
  document.getElementById('split-detail-sub').textContent = split.exercises.length + ' exercises';
  document.getElementById('screen-home').classList.remove('active');
  document.getElementById('screen-split').classList.add('active');
  renderExercises();
}

function renderExercises() {
  const split = state.splits.find(s => s.id === state.currentSplitId);
  const el = document.getElementById('exercises-list');
  if (!split.exercises.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">No exercises</div><div class="empty-sub">Tap + to add exercises to this split</div></div>`;
    document.getElementById('done-bar').style.display = 'none';
    return;
  }

  const hasSets = split.exercises.some(ex => ex.sets && ex.sets.length > 0);
  document.getElementById('done-bar').style.display = hasSets ? 'block' : 'none';

  el.innerHTML = split.exercises.map((ex, ei) => {
    const setCount = ex.sets ? ex.sets.filter(s => s.weight || s.reps).length : 0;
    return `
    <div class="ex-row" id="exrow-${ex.id}">
      <div class="ex-header" onclick="toggleEx('${ex.id}')">
        <div>
          <div class="ex-name-text">${ex.name}</div>
          <div class="ex-set-count">${setCount > 0 ? setCount + ' set' + (setCount !== 1 ? 's' : '') + ' logged' : 'No sets yet'}</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <button onclick="event.stopPropagation();deleteExercise('${ex.id}')" style="background:none;border:none;color:var(--muted2);font-size:0.85rem;cursor:pointer;padding:4px">✕</button>
          <div class="ex-expand" id="arrow-${ex.id}">▾</div>
        </div>
      </div>
      <div class="sets-area" id="sets-${ex.id}">
        <div class="input-labels">
          <div></div>
          <div class="set-label">KG</div>
          <div class="set-label">REPS</div>
          <div></div>
        </div>
        ${(ex.sets || []).map((set, si) => renderSetRow(ex.id, set, si)).join('')}
        <button class="btn-add-set" onclick="addSet('${ex.id}')">+ Add Set</button>
      </div>
    </div>
  `}).join('') + `<button class="add-ex-btn" onclick="openAddExercise()">+ Add Exercise</button>`;
}

function renderSetRow(exId, set, si) {
  return `
    <div class="set-row" id="setrow-${set.id}">
      <div class="set-num">${si + 1}</div>
      <input class="set-input" type="number" inputmode="decimal" placeholder="—"
        value="${set.weight || ''}"
        onchange="updateSet('${exId}','${set.id}','weight',this.value)"
        onfocus="this.select()">
      <input class="set-input" type="number" inputmode="numeric" placeholder="—"
        value="${set.reps || ''}"
        onchange="updateSet('${exId}','${set.id}','reps',this.value)"
        onfocus="this.select()">
      <button class="set-del" onclick="deleteSet('${exId}','${set.id}')">✕</button>
    </div>
  `;
}

function toggleEx(exId) {
  const area = document.getElementById('sets-' + exId);
  const arrow = document.getElementById('arrow-' + exId);
  const isOpen = area.classList.toggle('open');
  arrow.classList.toggle('open', isOpen);
  if (isOpen) {
    const split = state.splits.find(s => s.id === state.currentSplitId);
    const ex = split.exercises.find(e => e.id === exId);
    if (!ex.sets || ex.sets.length === 0) addSet(exId);
  }
}

function addSet(exId) {
  const split = state.splits.find(s => s.id === state.currentSplitId);
  const ex = split.exercises.find(e => e.id === exId);
  if (!ex.sets) ex.sets = [];

  // prefill with last set values
  const last = ex.sets[ex.sets.length - 1];
  ex.sets.push({ id: uid(), weight: last ? last.weight : '', reps: last ? last.reps : '' });
  save();
  renderExercises();
  // re-open
  requestAnimationFrame(() => {
    const area = document.getElementById('sets-' + exId);
    const arrow = document.getElementById('arrow-' + exId);
    if (area) { area.classList.add('open'); }
    if (arrow) { arrow.classList.add('open'); }
  });
}

function updateSet(exId, setId, field, value) {
  const split = state.splits.find(s => s.id === state.currentSplitId);
  const ex = split.exercises.find(e => e.id === exId);
  const set = ex.sets.find(s => s.id === setId);
  set[field] = value;
  save();
  // update done bar
  const hasSets = split.exercises.some(ex => ex.sets && ex.sets.some(s => s.weight || s.reps));
  document.getElementById('done-bar').style.display = hasSets ? 'block' : 'none';
  // update set count label
  const setCount = ex.sets.filter(s => s.weight || s.reps).length;
  const countEl = document.querySelector(`#exrow-${exId} .ex-set-count`);
  if (countEl) countEl.textContent = setCount > 0 ? setCount + ' set' + (setCount !== 1 ? 's' : '') + ' logged' : 'No sets yet';
}

function deleteSet(exId, setId) {
  const split = state.splits.find(s => s.id === state.currentSplitId);
  const ex = split.exercises.find(e => e.id === exId);
  ex.sets = ex.sets.filter(s => s.id !== setId);
  save();
  renderExercises();
  requestAnimationFrame(() => {
    const area = document.getElementById('sets-' + exId);
    const arrow = document.getElementById('arrow-' + exId);
    if (area) area.classList.add('open');
    if (arrow) arrow.classList.add('open');
  });
}

function deleteExercise(exId) {
  const split = state.splits.find(s => s.id === state.currentSplitId);
  split.exercises = split.exercises.filter(e => e.id !== exId);
  save();
  renderExercises();
}

// ── SESSION SAVE ──
function saveSession() {
  const split = state.splits.find(s => s.id === state.currentSplitId);
  const logged = split.exercises
    .map(ex => ({ name: ex.name, sets: (ex.sets || []).filter(s => s.weight || s.reps) }))
    .filter(ex => ex.sets.length > 0);

  if (!logged.length) return;

  state.sessions.unshift({
    id: uid(),
    splitName: split.name,
    splitColor: split.color,
    date: new Date().toISOString(),
    exercises: logged
  });

  // clear sets after saving
  split.exercises.forEach(ex => { ex.sets = []; });
  save();

  renderExercises();
  showToast('Session saved! 💪');
}

function showToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:var(--accent);color:#0a0a0a;padding:10px 20px;border-radius:20px;font-weight:600;font-size:0.9rem;z-index:999;white-space:nowrap;';
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

// ── HISTORY ──
function renderHistory() {
  const el = document.getElementById('history-list');
  if (!state.sessions || !state.sessions.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">📊</div><div class="empty-title">No sessions yet</div><div class="empty-sub">Complete a workout and save it to see your history</div></div>`;
    return;
  }

  const grouped = {};
  state.sessions.forEach(s => {
    const d = new Date(s.date);
    const key = d.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(s);
  });

  el.innerHTML = Object.entries(grouped).map(([date, sessions]) => `
    <div class="hist-day">
      <div class="hist-date">${date}</div>
      ${sessions.map(s => `
        <div class="hist-card">
          <div style="display:flex;align-items:center;margin-bottom:10px">
            <div style="width:8px;height:8px;border-radius:50%;background:${s.splitColor};margin-right:10px;flex-shrink:0"></div>
            <div style="font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:0.05em">${s.splitName}</div>
            <div style="margin-left:auto;font-size:0.72rem;color:var(--muted)">${new Date(s.date).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</div>
          </div>
          ${s.exercises.map(ex => `
            <div class="hist-ex">${ex.name}</div>
            <div class="hist-sets">
              ${ex.sets.map((set, i) => `
                <div class="hist-set-chip">S${i+1} <span>${set.weight ? set.weight+'kg' : '—'} × ${set.reps || '—'}</span></div>
              `).join('')}
            </div>
          `).join('<div style="height:10px"></div>')}
        </div>
      `).join('')}
    </div>
  `).join('');
}

function clearHistory() {
  if (!state.sessions.length) return;
  if (confirm('Clear all history?')) {
    state.sessions = [];
    save();
    renderHistory();
  }
}

// ── SPLIT MODAL ──
function buildColorPicker() {
  const el = document.getElementById('color-picker');
  el.innerHTML = COLORS.map(c => `
    <div class="color-opt ${c === state.selectedColor ? 'selected' : ''}"
      style="background:${c}"
      onclick="selectColor('${c}')"></div>
  `).join('');
}

function selectColor(c) {
  state.selectedColor = c;
  buildColorPicker();
}

function openNewSplit() {
  state.editingSplitId = null;
  document.getElementById('modal-split-title').textContent = 'NEW SPLIT';
  document.getElementById('split-name-input').value = '';
  state.selectedColor = COLORS[0];
  buildColorPicker();
  document.getElementById('modal-split').classList.add('open');
  setTimeout(() => document.getElementById('split-name-input').focus(), 100);
}

function saveSplit() {
  const name = document.getElementById('split-name-input').value.trim();
  if (!name) return;
  if (state.editingSplitId) {
    const s = state.splits.find(s => s.id === state.editingSplitId);
    s.name = name; s.color = state.selectedColor;
  } else {
    state.splits.push({ id: uid(), name, color: state.selectedColor, exercises: [] });
  }
  save();
  closeModal('modal-split');
  renderHome();
}

function deleteSplit(id) {
  if (!confirm('Delete this split?')) return;
  state.splits = state.splits.filter(s => s.id !== id);
  save();
  renderHome();
}

// ── EXERCISE MODAL ──
function openAddExercise() {
  document.getElementById('ex-name-input').value = '';
  const split = state.splits.find(s => s.id === state.currentSplitId);

  // figure out preset list by color match
  let presets = [];
  if (split.color === '#47c8ff') presets = PRESET_EXERCISES.pull;
  else if (split.color === '#ff6b6b') presets = PRESET_EXERCISES.legs;
  else if (split.color === '#c8ff47') presets = PRESET_EXERCISES.push;
  else presets = [...PRESET_EXERCISES.pull, ...PRESET_EXERCISES.legs, ...PRESET_EXERCISES.push];

  const existing = split.exercises.map(e => e.name.toLowerCase());
  const available = presets.filter(p => !existing.includes(p.toLowerCase()));

  const chips = document.getElementById('quick-add-chips');
  chips.innerHTML = available.length
    ? available.slice(0, 8).map(p => `<span class="chip" onclick="quickAdd('${p.replace(/'/g,"\\'")}')">+ ${p}</span>`).join('')
    : `<span style="font-size:0.8rem;color:var(--muted)">All preset exercises added</span>`;

  document.getElementById('modal-exercise').classList.add('open');
  setTimeout(() => document.getElementById('ex-name-input').focus(), 100);
}

function quickAdd(name) {
  const split = state.splits.find(s => s.id === state.currentSplitId);
  split.exercises.push({ id: uid(), name, sets: [] });
  save();
  closeModal('modal-exercise');
  renderExercises();
  document.getElementById('split-detail-sub').textContent = split.exercises.length + ' exercises';
}

function saveExercise() {
  const name = document.getElementById('ex-name-input').value.trim();
  if (!name) return;
  const split = state.splits.find(s => s.id === state.currentSplitId);
  split.exercises.push({ id: uid(), name, sets: [] });
  save();
  closeModal('modal-exercise');
  renderExercises();
  document.getElementById('split-detail-sub').textContent = split.exercises.length + ' exercises';
}

// ── UTILS ──
function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

// close modals on overlay click
document.querySelectorAll('.modal-overlay').forEach(o => {
  o.addEventListener('click', e => { if (e.target === o) o.classList.remove('open'); });
});

// enter to save in inputs
document.getElementById('split-name-input').addEventListener('keydown', e => { if (e.key === 'Enter') saveSplit(); });
document.getElementById('ex-name-input').addEventListener('keydown', e => { if (e.key === 'Enter') saveExercise(); });

// ── INIT ──
load();
renderHome();
</script>
</body>
</html>
